spring.application.name=Pokemon

# Conexión a MySQL (crea la BD si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/pokemon_api_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=pau

#JWT ELEMENTS
jwt.secret = "mi-clave-super-duper-secreta-para-jwt-springboot"
jwt.expiration = 180000

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea/actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true